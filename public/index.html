<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Gift Derby</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root {
    --track-dirt: #6b4226;
    --track-dirt-dark: #4e2f1a;
    --rail: #f2f2f2;
    --paper: #16130f;
    --card: #221d17;
    --ink: #f4ede1;
    --muted: #b8ab98;
    --gold: #f2b705;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 24px;
  }

  h1 {
    font-size: 28px;
    letter-spacing: 1px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    margin-bottom: 20px;
    font-size: 14px;
  }

  .status-bar {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .status-bar input {
    background: var(--card);
    border: 1px solid #3a3227;
    color: var(--ink);
    padding: 8px 10px;
    border-radius: 6px;
  }
  button {
    background: var(--gold);
    color: #1a1a1a;
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
  }
  button.secondary {
    background: var(--card);
    color: var(--ink);
    border: 1px solid #3a3227;
  }
  #tiktokStatus {
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 100px;
    background: #3a1414;
    color: #ff8a8a;
  }
  #tiktokStatus.connected {
    background: #14351a;
    color: #7be08c;
  }

  .track {
    background: var(--track-dirt);
    background-image: repeating-linear-gradient(
      90deg, var(--track-dirt) 0, var(--track-dirt) 38px, var(--track-dirt-dark) 38px, var(--track-dirt-dark) 40px
    );
    border-radius: 10px;
    padding: 14px 14px 14px 0;
    position: relative;
    overflow: hidden;
  }

  .lane {
    display: flex;
    align-items: center;
    height: 52px;
    position: relative;
    border-bottom: 1px dashed rgba(255,255,255,0.15);
  }
  .lane:last-child { border-bottom: none; }

  .lane-label {
    width: 160px;
    flex-shrink: 0;
    padding-left: 14px;
    font-size: 13px;
    color: var(--rail);
  }
  .lane-label .gift {
    display: block;
    font-size: 11px;
    color: var(--muted);
  }

  .lane-track {
    position: relative;
    flex: 1;
    height: 100%;
  }

  .finish-line {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 6px;
    background: repeating-linear-gradient(45deg, #fff 0 6px, #000 6px 12px);
  }

  .horse {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 28px;
    transition: left 0.35s cubic-bezier(.2,.9,.3,1.3);
    left: 0;
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.4));
  }

  .winner-banner {
    margin-top: 16px;
    padding: 14px;
    background: linear-gradient(90deg, #3a2c05, #221d17);
    border: 1px solid var(--gold);
    border-radius: 8px;
    font-size: 18px;
    display: none;
  }
  .winner-banner.show { display: block; }

  .debug-panel {
    margin-top: 28px;
    background: var(--card);
    border-radius: 10px;
    padding: 16px;
  }
  .debug-panel h2 {
    font-size: 16px;
    margin: 0 0 4px;
  }
  .debug-panel p {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 14px;
  }
  .gift-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .gift-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: #2c2419;
    border: 1px solid #3a3227;
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--ink);
    cursor: pointer;
    font-size: 12px;
  }
  .gift-btn:hover { border-color: var(--gold); }
  .gift-btn .emoji { font-size: 22px; }
  .gift-btn .count-row {
    display: flex;
    gap: 4px;
    margin-top: 4px;
  }
  .gift-btn .count-row button {
    font-size: 11px;
    padding: 3px 7px;
  }
</style>
</head>
<body>

  <h1>🏇 Gift Derby</h1>
  <p class="subtitle">Each horse is locked to one TikTok gift. Every gift sent moves that horse forward by the number sent.</p>

  <div class="status-bar">
    <input id="tiktokUsername" placeholder="TikTok username (no @)" />
    <button id="connectBtn">Connect</button>
    <span id="tiktokStatus">Not connected</span>
    <button class="secondary" id="resetBtn" style="margin-left:auto">Reset Race</button>
  </div>

  <div class="track" id="track"></div>

  <div class="winner-banner" id="winnerBanner"></div>

  <div class="debug-panel">
    <h2>🧪 Debug: Simulate Gifts</h2>
    <p>No live TikTok stream needed — click a gift to test how a horse reacts. Use the +1 / +5 buttons to simulate a combo.</p>
    <div class="gift-buttons" id="giftButtons"></div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const track = document.getElementById('track');
  const giftButtons = document.getElementById('giftButtons');
  const winnerBanner = document.getElementById('winnerBanner');
  const tiktokStatus = document.getElementById('tiktokStatus');

  let horses = [];
  let trackLength = 40;

  function renderTrack() {
    track.innerHTML = horses.map(h => `
      <div class="lane" id="lane-${h.id}">
        <div class="lane-label">${h.name}<span class="gift">${h.emoji} ${h.giftName}</span></div>
        <div class="lane-track">
          <div class="finish-line"></div>
          <div class="horse" id="horse-${h.id}" style="left: 0%;">🐎</div>
        </div>
      </div>
    `).join('');
    updateHorsePositions();
  }

  function updateHorsePositions() {
    horses.forEach(h => {
      const el = document.getElementById(`horse-${h.id}`);
      if (!el) return;
      const pct = Math.min((h.position / trackLength) * 100, 96);
      el.style.left = pct + '%';
    });
  }

  function renderDebugButtons() {
    giftButtons.innerHTML = horses.map(h => `
      <div class="gift-btn">
        <span class="emoji">${h.emoji}</span>
        <span>${h.giftName}</span>
        <div class="count-row">
          <button onclick="sendDebugGift('${h.giftName}', 1)">+1</button>
          <button onclick="sendDebugGift('${h.giftName}', 5)">+5</button>
          <button onclick="sendDebugGift('${h.giftName}', 10)">+10</button>
        </div>
      </div>
    `).join('');
  }

  function sendDebugGift(giftName, count) {
    socket.emit('debugGift', { giftName, count });
  }

  socket.on('raceReset', data => {
    horses = data.horses;
    trackLength = data.trackLength;
    winnerBanner.classList.remove('show');
    renderTrack();
    renderDebugButtons();
  });

  socket.on('horseMove', data => {
    const horse = horses.find(h => h.id === data.horseId);
    if (horse) horse.position = data.position;
    updateHorsePositions();
  });

  socket.on('raceFinished', data => {
    winnerBanner.textContent = `🏆 ${data.winner.emoji} ${data.winner.name} wins! (Gift: ${data.winner.giftName})`;
    winnerBanner.classList.add('show');
  });

  socket.on('tiktokStatus', data => {
    if (data.connected) {
      tiktokStatus.textContent = `Connected to @${data.username}`;
      tiktokStatus.classList.add('connected');
    } else {
      tiktokStatus.textContent = data.error ? `Error: ${data.error}` : 'Not connected';
      tiktokStatus.classList.remove('connected');
    }
  });

  document.getElementById('connectBtn').addEventListener('click', () => {
    const username = document.getElementById('tiktokUsername').value;
    socket.emit('connectTikTok', username);
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    socket.emit('resetRace');
  });
</script>
</body>
</html>
